<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-blue-100 via-white to-indigo-100 px-4">

    <!-- Card -->
    <div class="bg-white shadow-2xl rounded-3xl overflow-hidden flex w-full max-w-5xl">

        <!-- Left -->
        <div class="hidden md:flex w-1/2 bg-gradient-to-br from-blue-600 to-indigo-700 text-white flex-col justify-center items-center p-10">

            <div class="mb-6">

                <div class="w-24 h-24 bg-white/20 rounded-3xl flex items-center justify-center backdrop-blur-sm">

                    <i class="ri-capsule-fill text-5xl"></i>

                </div>

            </div>

            <h1 class="text-4xl font-bold mb-4">
                PharmaSys
            </h1>

            <p class="text-center text-blue-100 text-lg leading-relaxed max-w-sm">
                Plateforme intelligente de gestion de pharmacie,
                de stock et de suivi des médicaments.
            </p>

        </div>

        <!-- Right -->
        <div class="w-full md:w-1/2 p-10">

            <!-- Title -->
            <div class="mb-8">

                <h2 class="text-3xl font-bold text-gray-800 mb-2">
                    Connexion
                </h2>

                <p class="text-gray-500">
                    Connectez-vous à votre espace PharmaSys
                </p>

            </div>

            <!-- Error -->
            <div
                    *ngIf="errorMessage"
                    class="bg-red-100 text-red-600 px-4 py-3 rounded-xl mb-6 text-sm font-medium"
            >
                {{ errorMessage }}
            </div>

            <!-- Form -->
            <div class="space-y-5">

                <!-- Email -->
                <div>

                    <label class="block text-sm font-semibold text-gray-600 mb-2">
                        Adresse email
                    </label>

                    <div class="relative">

                        <input
                                type="email"
                                [(ngModel)]="email"
                                placeholder="admin@gmail.com"
                                class="w-full border border-gray-300 rounded-xl px-4 py-3 pl-12 focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
                        />

                        <i class="ri-mail-line absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-lg"></i>

                    </div>

                </div>

                <!-- Password -->
                <div>

                    <label class="block text-sm font-semibold text-gray-600 mb-2">
                        Mot de passe
                    </label>

                    <div class="relative">

                        <input
                                type="password"
                                [(ngModel)]="password"
                                placeholder="********"
                                class="w-full border border-gray-300 rounded-xl px-4 py-3 pl-12 focus:outline-none focus:ring-2 focus:ring-blue-500 transition"
                        />

                        <i class="ri-lock-line absolute left-4 top-1/2 -translate-y-1/2 text-gray-400 text-lg"></i>

                    </div>

                </div>

                <!-- Button -->
                <button
                        (click)="login()"
                        [disabled]="loading"
                        class="w-full bg-blue-600 hover:bg-blue-700 disabled:bg-blue-300 text-white py-3 rounded-xl font-semibold text-lg transition-all duration-300 shadow-lg hover:shadow-blue-300/50"
                >

          <span *ngIf="!loading">
            Se connecter
          </span>

                    <span *ngIf="loading">
            Connexion...
          </span>

                </button>

            </div>

            <!-- Footer -->
            <div class="mt-8 text-center text-sm text-gray-400">

                © 2026 PharmaSys — Gestion de pharmacie by Thierno

            </div>

        </div>

    </div>

</div>
